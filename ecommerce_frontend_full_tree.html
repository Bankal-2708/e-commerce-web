<h2 class="sr-only">E-commerce frontend ka poora folder structure tree, fully expanded</h2>
<div id="tree-root" style="font-size:14px;"></div>

<script>
const data = {
  name: "frontend/", type: "folder", children: [
    { name: "public/", type: "folder", children: [
      { name: "index.html", type: "file" },
      { name: "favicon.ico", type: "file" }
    ]},
    { name: "src/", type: "folder", children: [
      { name: "assets/", type: "folder", children: [
        { name: "images/", type: "file" },
        { name: "icons/", type: "file" }
      ]},
      { name: "components/", type: "folder", children: [
        { name: "Navbar.jsx", type: "file" },
        { name: "Footer.jsx", type: "file" },
        { name: "ProductCard.jsx", type: "file" },
        { name: "CartItem.jsx", type: "file" },
        { name: "SearchBar.jsx", type: "file" },
        { name: "PrivateRoute.jsx", type: "file" }
      ]},
      { name: "pages/", type: "folder", children: [
        { name: "Home.jsx", type: "file" },
        { name: "Login.jsx", type: "folder", fields: ["email ya phone number (text)", "password (password, masked)", "remember me (checkbox)", "submit button"] },
        { name: "Signup.jsx", type: "folder", fields: ["full name (text)", "email (text)", "phone number (text)", "password (password)", "confirm password (password)", "submit button"] },
        { name: "ProductListing.jsx", type: "file" },
        { name: "ProductDetail.jsx", type: "file" },
        { name: "Cart.jsx", type: "file" },
        { name: "Checkout.jsx", type: "folder", fields: ["full name", "address line 1/2", "city, state, pincode", "phone number", "payment method (COD/UPI/Card)"] },
        { name: "OrderHistory.jsx", type: "file" },
        { name: "Profile.jsx", type: "folder", fields: ["name (text, editable)", "email (text)", "phone (text)", "profile photo (file upload)", "saved addresses (list)"] }
      ]},
      { name: "context/", type: "folder", children: [
        { name: "AuthContext.jsx", type: "file" },
        { name: "CartContext.jsx", type: "file" }
      ]},
      { name: "services/", type: "folder", children: [
        { name: "api.js", type: "file" },
        { name: "authService.js", type: "file" },
        { name: "productService.js", type: "file" },
        { name: "orderService.js", type: "file" }
      ]},
      { name: "hooks/", type: "folder", children: [
        { name: "useAuth.js", type: "file" },
        { name: "useCart.js", type: "file" }
      ]},
      { name: "utils/", type: "folder", children: [
        { name: "validators.js", type: "file" },
        { name: "formatCurrency.js", type: "file" }
      ]},
      { name: "App.jsx", type: "file" },
      { name: "main.jsx", type: "file" }
    ]},
    { name: "package.json", type: "file" },
    { name: ".env", type: "file" }
  ]
};

function iconFor(node) {
  if (node.fields) return 'ti-forms';
  if (node.type === 'folder') return 'ti-folder';
  return 'ti-file';
}

function render(node, depth) {
  const hasChildren = (node.children && node.children.length) || node.fields;
  const id = Math.random().toString(36).slice(2, 9);
  let html = '<div style="margin-left:' + (depth * 18) + 'px;">';
  html += '<div class="node-row" data-target="' + id + '" style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--radius);cursor:' + (hasChildren ? 'pointer' : 'default') + ';">';
  if (hasChildren) {
    html += '<i class="ti ti-chevron-down toggle-icon" style="font-size:14px;color:var(--text-muted);transition:transform .15s;"></i>';
  } else {
    html += '<span style="width:14px;display:inline-block;"></span>';
  }
  html += '<i class="ti ' + iconFor(node) + '" style="font-size:16px;color:' + (node.fields ? 'var(--text-accent)' : 'var(--text-secondary)') + ';" aria-hidden="true"></i>';
  html += '<span style="' + (node.fields ? 'color:var(--text-accent);font-weight:500;' : '') + '">' + node.name + '</span>';
  html += '</div>';
  html += '<div class="children" id="c-' + id + '" style="display:block;">';
  if (node.children) {
    node.children.forEach(child => { html += render(child, depth + 1); });
  }
  if (node.fields) {
    html += '<div style="margin-left:' + ((depth + 1) * 18) + 'px;padding:8px 10px;background:var(--surface-1);border-radius:var(--radius);margin-top:4px;margin-bottom:4px;">';
    html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">required fields</div>';
    node.fields.forEach(f => {
      html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;color:var(--text-secondary);"><i class="ti ti-point-filled" style="font-size:8px;color:var(--text-accent);" aria-hidden="true"></i>' + f + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

document.getElementById('tree-root').innerHTML = render(data, 0);

document.getElementById('tree-root').addEventListener('click', (e) => {
  const row = e.target.closest('.node-row');
  if (!row) return;
  const id = row.getAttribute('data-target');
  const childDiv = document.getElementById('c-' + id);
  const icon = row.querySelector('.toggle-icon');
  if (!childDiv) return;
  const isOpen = childDiv.style.display === 'block';
  childDiv.style.display = isOpen ? 'none' : 'block';
  if (icon) { icon.classList.toggle('ti-chevron-down', !isOpen); icon.classList.toggle('ti-chevron-right', isOpen); }
});
</script>
